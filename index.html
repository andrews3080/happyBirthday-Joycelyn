<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Happy Birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  /* ============================================================
     EDIT ME — everything you need to personalize lives up here
     in CONFIG (bottom of the <script>), and in a few spots
     marked "PHOTO SLOT" below in the HTML.
     ============================================================ */

  :root{
    --ivory:   #1f1521;  /* page background — deep plum */
    --paper:   #2a1f2c;  /* card backgrounds (letter, ticket) — slightly lighter plum */
    --plum:    #f5ece7;  /* main text — warm ivory, was the dark text color before */
    --plum-soft: #c7b3c2; /* secondary/muted text */
    --rose:    #e3a3ac;  /* accent — brightened so it still pops on dark */
    --gold:    #d3ab73;  /* accent — brightened so it still pops on dark */
    --line:    rgba(245,236,231,0.16); /* hairlines/borders */
  }

  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }

  body{
    margin:0;
    background:var(--ivory);
    color:var(--plum);
    font-family:'Jost', sans-serif;
    font-weight:300;
    -webkit-font-smoothing:antialiased;
  }

  h1,h2,.display{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    margin:0;
  }

  .eyebrow{
    font-family:'Jost', sans-serif;
    font-size:0.72rem;
    letter-spacing:0.32em;
    text-transform:uppercase;
    color:var(--gold);
  }

  a{ color:inherit; }
  :focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }

  /* ---------- HERO ---------- */
  .hero{
    min-height:100svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:8vh 6vw;
    position:relative;
  }

  .hero .eyebrow{ margin-bottom:1.4rem; opacity:0; animation:rise 0.9s ease forwards 0.15s; }

  .hero h1{
    font-size:clamp(2.6rem, 9vw, 6rem);
    font-style:italic;
    line-height:1.05;
    opacity:0; animation:rise 0.9s ease forwards 0.35s;
  }

  .hero .subline{
    margin-top:1.1rem;
    font-size:1rem;
    color:var(--plum-soft);
    letter-spacing:0.02em;
    opacity:0; animation:rise 0.9s ease forwards 0.55s;
  }

  @keyframes rise{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @media (prefers-reduced-motion: reduce){
    .hero .eyebrow, .hero h1, .hero .subline, .ticket{ animation:none !important; opacity:1 !important; transform:none !important; }
  }

  /* ---------- TICKET / COUNTDOWN (signature element) ---------- */
  .ticket{
    margin-top:4rem;
    width:min(560px, 92vw);
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:2px;
    box-shadow:0 24px 50px -30px rgba(0,0,0,0.6);
    display:flex;
    opacity:0; animation:rise 0.9s ease forwards 0.75s;
  }

  .ticket .stub{
    width:34%;
    padding:1.6rem 1rem;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    border-right:1.5px dashed var(--line);
    position:relative;
  }
  .ticket .stub::before,
  .ticket .stub::after{
    content:"";
    position:absolute;
    right:-7px;
    width:14px; height:14px;
    background:var(--ivory);
    border-radius:50%;
  }
  .ticket .stub::before{ top:-7px; }
  .ticket .stub::after{ bottom:-7px; }

  .ticket .stub .eyebrow{ margin-bottom:0.5rem; }
  .ticket .stub .label{ font-size:0.75rem; color:var(--plum-soft); }

  .ticket .body{
    flex:1;
    padding:1.6rem 1.6rem;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:0.75rem;
  }

  .ticket .body .eyebrow{ margin-bottom:0.1rem; }

  .countdown{
    display:flex;
    gap:1.1rem;
  }
  .countdown .unit{ text-align:left; }
  .countdown .num{
    font-family:'Cormorant Garamond', serif;
    font-size:2rem;
    font-weight:600;
    line-height:1;
  }
  .countdown .u-label{
    font-size:0.62rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--plum-soft);
  }

  .scroll-cue{
    margin-top:3.2rem;
    font-size:0.7rem;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--plum-soft);
    opacity:0; animation:rise 0.9s ease forwards 0.95s;
  }

  /* ---------- LETTER ---------- */
  .letter-section{
    padding:12vh 6vw;
    display:flex;
    justify-content:center;
  }
  .letter{
    max-width:640px;
    background:var(--paper);
    border:1px solid var(--line);
    padding:clamp(2.2rem, 5vw, 4rem);
    position:relative;
  }
  .letter::before{
    content:"";
    position:absolute;
    top:14px; left:14px; right:14px; bottom:14px;
    border:1px solid var(--line);
    pointer-events:none;
  }
  .letter .eyebrow{ display:block; margin-bottom:1.6rem; }
  .letter .greeting{
    font-size:1.7rem;
    font-style:italic;
    margin-bottom:1.4rem;
  }
  .letter p{
    font-size:1.02rem;
    line-height:1.85;
    color:var(--plum-soft);
    margin:0 0 1.1rem;
  }
  .letter .sign-off{
    margin-top:1.8rem;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:1.3rem;
    color:var(--plum);
  }

  /* ---------- GALLERY ---------- */
  .gallery-section{ padding:4vh 6vw 12vh; }
  .gallery-section .heading{
    text-align:center;
    margin-bottom:3rem;
  }
  .gallery-section .heading h2{
    font-size:clamp(1.8rem, 4vw, 2.6rem);
    font-style:italic;
    margin-top:0.5rem;
  }

  .gallery{
    max-width:1000px;
    margin:0 auto;
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:1rem;
  }
  .frame{
    aspect-ratio:4/5;
    border:1px solid var(--line);
    background:
      linear-gradient(135deg, rgba(211,171,115,0.14), rgba(227,163,172,0.16));
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
  }
  .frame img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .frame .placeholder{
    text-align:center;
    color:var(--plum-soft);
  }
  .frame .placeholder .plus{
    font-family:'Cormorant Garamond', serif;
    font-size:2rem;
    color:var(--gold);
    display:block;
    margin-bottom:0.3rem;
  }
  .frame .placeholder .cap{
    font-size:0.68rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
  }
  .frame:nth-child(3n+2){ margin-top:1.6rem; }

  @media (max-width:640px){
    .gallery{ grid-template-columns:repeat(2, 1fr); }
    .frame:nth-child(3n+2){ margin-top:0; }
    .ticket{ flex-direction:column; }
    .ticket .stub{ width:100%; border-right:none; border-bottom:1.5px dashed var(--line); padding:1.2rem; }
    .ticket .stub::before{ top:auto; bottom:-7px; left:-7px; right:auto; }
    .ticket .stub::after{ bottom:-7px; right:-7px; }
    .countdown{ gap:0.8rem; }
  }

  /* ---------- WATCH / VIDEO REVEAL ---------- */
  .watch-section{
    max-width:640px;
    margin:0 auto;
    padding:6vh 6vw 10vh;
    text-align:center;
  }
  .watch-heading{
    font-size:clamp(1.6rem, 4vw, 2.2rem);
    font-style:italic;
    margin-bottom:2.2rem;
  }
  .play-btn{
    width:84px; height:84px;
    border-radius:50%;
    border:1px solid var(--gold);
    background:var(--paper);
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    transition:transform 0.25s ease, background 0.25s ease;
  }
  .play-btn:hover{ background:var(--ivory); transform:scale(1.05); }
  .play-icon{
    color:var(--gold);
    font-size:1.4rem;
    margin-left:4px;
  }
  .hidden-video{
    display:none;
    width:100%;
    margin-top:2.2rem;
    border:1px solid var(--line);
    background:#000;
  }
  .hidden-video.shown{ display:block; }
  .watch-section.playing .play-btn{ display:none; }

  /* ---------- FOOTER ---------- */
  footer{
    text-align:center;
    padding:6vh 6vw 8vh;
    border-top:1px solid var(--line);
  }
  footer .heart{
    width:20px; height:20px;
    margin:0 auto 1rem;
    display:block;
  }
  footer .from{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:1.2rem;
  }
</style>
</head>
<body>

<section class="hero">
  <div class="eyebrow">a little something for</div>
  <h1 id="heroName">—</h1>
  <div class="subline" id="heroSubline">wishing you the happiest of days</div>

  <div class="ticket">
    <div class="stub">
      <div class="eyebrow">admit</div>
      <div class="label" id="ticketDate">—</div>
    </div>
    <div class="body">
      <div class="eyebrow">counting down to your day</div>
      <div class="countdown" id="countdown">
        <div class="unit"><div class="num" id="cd-days">00</div><div class="u-label">days</div></div>
        <div class="unit"><div class="num" id="cd-hours">00</div><div class="u-label">hrs</div></div>
        <div class="unit"><div class="num" id="cd-mins">00</div><div class="u-label">min</div></div>
        <div class="unit"><div class="num" id="cd-secs">00</div><div class="u-label">sec</div></div>
      </div>
    </div>
  </div>

  <div class="scroll-cue">scroll down ↓</div>
</section>

<section class="letter-section">
  <div class="letter">
    <span class="eyebrow">a note, just for you</span>
    <div class="greeting" id="letterGreeting">Dear —,</div>
    <div id="letterBody">
      <!-- filled by script from CONFIG.message -->
    </div>
    <div class="sign-off" id="letterSignoff">with love, —</div>
  </div>
</section>

<footer>
  <svg class="heart" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 21s-7.2-4.6-10-9.2C0.3 8.7 1.6 5 5.2 4.1c2.1-0.5 4 0.5 5.1 2.2 1-1.7 3-2.7 5.1-2.2C19 5 20.3 8.7 18.6 11.8 15.4 16.4 12 21 12 21z" stroke="#d3ab73" stroke-width="1.2"/>
  </svg>
  <div class="eyebrow">made with care</div>
  <div class="from" id="footerFrom">by —</div>
</footer>

<script>
  /* ============================================================
     CONFIG — this is the only part you need to touch.
     ============================================================ */
  const CONFIG = {
    name: "Joycelyn",              // <-- her name goes here
    birthday: "2026-08-07",        // <-- format: YYYY-MM-DD (any year is fine, countdown finds the next one)
    from: "Andrews",             // <-- your name / sign-off

    message: `
      Some people fill a room with warmth without even trying to —
      you've been doing that for as long I've known you.

      This little page is just a small thank-you: for the laughter,
      the late-night chats, and the way you make ordinary days feel a little more golden.

      Here's to another year that's exactly as bright as you are.
      I hope today feels as good as you make everyone around you feel.
    `
  };

  /* ============================================================
     Below this line is just the logic that reads CONFIG above
     and fills in the page + runs the countdown. No need to edit.
     ============================================================ */

  document.getElementById('heroName').textContent = CONFIG.name;
  document.getElementById('letterGreeting').textContent = `Dear ${CONFIG.name},`;
  document.getElementById('letterSignoff').textContent = `with love, ${CONFIG.from}`;
  document.getElementById('footerFrom').textContent = `by ${CONFIG.from}`;

  const letterBody = document.getElementById('letterBody');
  CONFIG.message.trim().split(/\n\s*\n/).forEach(para => {
    const p = document.createElement('p');
    p.textContent = para.replace(/\s+/g, ' ').trim();
    letterBody.appendChild(p);
  });

  // ---- Countdown: finds the NEXT occurrence of month/day in CONFIG.birthday ----
  function nextBirthday(dateStr){
    const parsed = new Date(dateStr + "T00:00:00");
    const now = new Date();
    let next = new Date(now.getFullYear(), parsed.getMonth(), parsed.getDate(), 0, 0, 0);
    // Compare against the END of that day, not the start — so the whole
    // birthday day still counts as "today", not "already passed".
    const endOfDay = new Date(next.getFullYear(), next.getMonth(), next.getDate(), 23, 59, 59, 999);
    if (endOfDay < now) {
      next = new Date(now.getFullYear() + 1, parsed.getMonth(), parsed.getDate(), 0, 0, 0);
    }
    return next;
  }

  const target = nextBirthday(CONFIG.birthday);
  document.getElementById('ticketDate').textContent =
    target.toLocaleDateString(undefined, { month: 'long', day: 'numeric' });

  function pad(n){ return String(n).padStart(2,'0'); }

  function tick(){
    const now = new Date();
    let diff = target - now;

    if (diff <= 0) {
      document.getElementById('countdown').outerHTML =
        `<div class="num" style="font-size:1.4rem;">It's today happy birthday! 🎉</div>`;
      document.getElementById('heroSubline').textContent = "happy birthday, today of all days";
      clearInterval(timer);
      return;
    }

    const days = Math.floor(diff / (1000*60*60*24));
    const hours = Math.floor((diff / (1000*60*60)) % 24);
    const mins = Math.floor((diff / (1000*60)) % 60);
    const secs = Math.floor((diff / 1000) % 60);

    document.getElementById('cd-days').textContent = pad(days);
    document.getElementById('cd-hours').textContent = pad(hours);
    document.getElementById('cd-mins').textContent = pad(mins);
    document.getElementById('cd-secs').textContent = pad(secs);
  }

  tick();
  const timer = setInterval(tick, 1000);

  // ---- Click-to-reveal surprise video ----
  const playBtn = document.getElementById('playBtn');
  const video = document.getElementById('surpriseVideo');
  playBtn.addEventListener('click', () => {
    video.classList.add('shown');
    playBtn.closest('.watch-section').classList.add('playing');
    video.play();
  });
</script>
